<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1318">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<style>
:root{color-scheme:dark light;--bg:#0f1318;--sf:#181e26;--sf2:#222a34;--tx:#e9edf2;--mu:#8995a5;--ac:#2ed3b7;--ac2:#06352d;--rd:#ff6b6b;--ln:#2a3340}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f7;--sf:#fff;--sf2:#e8ecf1;--tx:#12171d;--mu:#667385;--ac:#0b9c86;--ac2:#fff;--rd:#d93f3f;--ln:#dde2e9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(150px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 16px}
h2{font-size:15px;font-weight:700;color:var(--mu);margin:22px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tap{cursor:pointer}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{background:var(--ac);color:var(--ac2);font-weight:700;border-radius:12px;padding:11px 18px;min-height:44px}
.btn.big{width:100%;padding:18px;font-size:18px;border-radius:16px}
.ghost{background:var(--sf2);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px}
.x{color:var(--mu);font-size:14px;padding:8px;min-height:44px}.danger{color:var(--rd)}
input,select{font:inherit;color:inherit;background:var(--sf2);border:0;border-radius:12px;padding:12px;width:100%;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac)}
.sg{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.sg input{text-align:center;font-size:18px;font-weight:600}
.hd{color:var(--mu);font-size:13px;margin-top:12px;text-align:center}
.sn{text-align:center;color:var(--mu);font-weight:700}
.ck{width:48px;height:48px;border-radius:50%;background:var(--sf2);color:var(--mu);font-size:20px;font-weight:800}
.dn .ck{background:var(--ac);color:var(--ac2)}.dn input{background:color-mix(in srgb,var(--ac) 16%,var(--sf2))}
.pr{color:var(--ac);font-size:13px;font-weight:700;text-align:right;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.name{font-size:22px;font-weight:800;background:none;padding:4px 0;min-height:0;border-radius:6px}
.el{font-size:46px;font-weight:800;color:var(--ac);letter-spacing:-.03em;line-height:1.1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:56px;font-size:12px;font-weight:600;color:var(--mu);border-top:3px solid transparent;margin-top:-1px}
nav button.on{color:var(--ac);border-top-color:var(--ac)}
#rt{display:none;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--sf2);border:1px solid var(--ac);border-radius:16px;overflow:hidden;z-index:6;max-width:536px;margin:auto}
#rt.on{display:block}#rtb{position:absolute;inset:0 auto 0 0;width:100%;background:color-mix(in srgb,var(--ac) 28%,transparent)}
.rr{position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 16px}.rr b{font-size:26px;min-width:64px}.rr span{flex:1;color:var(--mu)}
.rr button{padding:10px;font-weight:700;min-height:44px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}#sheet.open{display:flex}
.sh{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:85vh;padding:16px;overflow:auto;margin:auto auto 0}
.li{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--ln)}.new{color:var(--ac);font-weight:700}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ch{width:100%;margin-top:12px}.ct{fill:var(--mu);font-size:10px}
.set{display:flex;flex-direction:column;gap:8px}.set .ghost{text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="app"></main>
<div id="rt"><div id="rtb"></div><div class="rr"><b id="rtt">0:00</b><span>Rest</span><button data-a="rtadd" data-p="-15">−15</button><button data-a="rtadd" data-p="15">+15</button><button data-a="rts">Skip</button></div></div>
<nav><button data-a="tab" data-p="train">Train</button><button data-a="tab" data-p="hist">History</button><button data-a="tab" data-p="prog">Progress</button><button data-a="tab" data-p="rout">Routines</button><button data-a="tab" data-p="set">Settings</button></nav>
<div id="sheet"></div><div id="toast"></div><input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const KEY='liftlog.v1',K=2.20462,D=()=>({w:[],r:[],bw:[],cur:null,u:'kg',rest:90,ex:[]});
let S=Object.assign(D(),JSON.parse(localStorage.getItem(KEY)||'{}')),tab='train',sel=null,met='e',rt=null,ho={},AC=null;
const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full. Export your data.')}};
const dw=k=>+(S.u==='kg'?k:k*K).toFixed(1),pw=v=>S.u==='kg'?+v:+v/K,e1=(w,r)=>w>0&&r>0?w*(1+r/30):0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),fs=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fm=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const LIB=['Bench Press','Incline Bench Press','Dumbbell Bench Press','Overhead Press','Dumbbell Shoulder Press','Lateral Raise','Face Pull','Squat','Front Squat','Leg Press','Lunge','Bulgarian Split Squat','Leg Extension','Leg Curl','Romanian Deadlift','Deadlift','Hip Thrust','Calf Raise','Pull-up','Chin-up','Lat Pulldown','Barbell Row','Dumbbell Row','Seated Cable Row','T-Bar Row','Bicep Curl','Hammer Curl','Preacher Curl','Tricep Pushdown','Skull Crusher','Overhead Tricep Extension','Dip','Push-up','Chest Fly','Cable Crossover','Shrug','Plank','Hanging Leg Raise','Cable Crunch'];
const allEx=()=>[...new Set([...LIB,...S.ex])].sort();
const sets=n=>S.w.flatMap(w=>w.ex.filter(e=>e.n===n).flatMap(e=>e.sets));
const hist=n=>S.w.filter(w=>w.ex.some(e=>e.n===n)).sort((a,b)=>b.start-a.start);
const lastSets=n=>{const h=hist(n)[0];return h?h.ex.find(e=>e.n===n).sets:[]};
const bestE=n=>Math.max(0,...sets(n).map(s=>e1(s.w,s.r))),vol=w=>w.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function ding(){try{[0,.3].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.2)})}catch(e){}navigator.vibrate&&navigator.vibrate([200,100,200])}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.cur)wake()});
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"',day=()=>new Date().toISOString().slice(0,10);
function csvSets(){const r=['date,workout,exercise,set,weight_kg,weight_lb,reps,est_1rm_kg'];S.w.slice().sort((a,b)=>a.start-b.start).forEach(w=>w.ex.forEach(e=>e.sets.forEach((s,i)=>r.push([new Date(w.start).toISOString().slice(0,10),q(w.name),q(e.n),i+1,+s.w.toFixed(2),+(s.w*K).toFixed(2),s.r,+e1(s.w,s.r).toFixed(1)].join(',')))));return r.join('\n')}
function chart(p,f=v=>v){if(p.length<2)return'<p class="mu">Log at least two entries to see a trend.</p>';
const W=320,H=150,L=38,R=12,T=14,B=24,xs=p.map(a=>a.x),ys=p.map(a=>a.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
const sx=x=>L+(x1==x0?.5:(x-x0)/(x1-x0))*(W-L-R),sy=y=>H-B-(y1==y0?.5:(y-y0)/(y1-y0))*(H-B-T),d=p.map((a,i)=>(i?'L':'M')+sx(a.x).toFixed(1)+' '+sy(a.y).toFixed(1)).join('');
return`<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="Trend chart"><path d="${d}L${sx(x1)} ${H-B}L${sx(x0)} ${H-B}Z" fill="var(--ac)" opacity=".13"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${p.map(a=>`<circle cx="${sx(a.x)}" cy="${sy(a.y)}" r="3.5" fill="var(--ac)"/>`).join('')}<text class="ct" x="${L-5}" y="${T+3}" text-anchor="end">${f(y1)}</text><text class="ct" x="${L-5}" y="${H-B}" text-anchor="end">${f(y0)}</text><text class="ct" x="${L}" y="${H-6}">${fs(x0)}</text><text class="ct" x="${W-R}" y="${H-6}" text-anchor="end">${fs(x1)}</text></svg>`}
function vTrain(){const c=S.cur;
if(!c){const n=S.w.filter(w=>w.start>Date.now()-6048e5).length;
return`<h1>Train</h1><button class="btn big" data-a="start">Start empty workout</button><p class="mu">Last 7 days: ${n} workout${n==1?'':'s'}</p><h2>Routines</h2>`+(S.r.length?S.r.map(r=>`<div class="card"><div class="row"><div><b>${esc(r.name)}</b><div class="mu">${r.ex.map(e=>esc(e.n)).join(', ')}</div></div><button class="btn" data-a="startr" data-p="${r.id}">Start</button></div></div>`).join(''):'<p class="mu">Save a workout as a routine to start it here in one tap.</p>')}
return`<div class="top"><div><input class="name" data-f="name" value="${esc(c.name)}" aria-label="Workout name"><div class="el" id="el">${fm((Date.now()-c.start)/1e3)}</div></div><button class="btn" data-a="finish">Finish</button></div>`+
c.ex.map((e,i)=>{const ls=lastSets(e.n).filter(s=>s.d);return`<div class="card"><div class="row"><b>${esc(e.n)}</b><button class="x" data-a="rmex" data-p="${i}">Remove</button></div><div class="mu">${ls.length?'Last: '+ls.map(s=>dw(s.w)+'×'+s.r).join(', '):'First time logging this'}</div><div class="sg hd"><span>Set</span><span>${S.u}</span><span>Reps</span><span></span></div>`+
e.sets.map((s,j)=>`<div class="sg ${s.d?'dn':''}"><span class="sn">${j+1}</span><input inputmode="decimal" data-f="${i}.${j}.w" value="${s.w?dw(s.w):''}" placeholder="0" aria-label="Weight"><input inputmode="numeric" data-f="${i}.${j}.r" value="${s.r||''}" placeholder="0" aria-label="Reps"><button class="ck" data-a="done" data-p="${i}.${j}" aria-label="Mark set done">✓</button></div>${s.pr?'<div class="pr">New personal record</div>':''}`).join('')+
`<div class="row" style="margin-top:10px"><button class="ghost" data-a="addset" data-p="${i}">Add set</button><button class="x" data-a="rmset" data-p="${i}">Remove last set</button></div></div>`}).join('')+
`<button class="btn big" data-a="addex">Add exercise</button><div class="row" style="margin-top:12px"><button class="ghost" data-a="saver" data-p="cur">Save as routine</button><button class="x danger" data-a="cancel">Discard workout</button></div>`}
function vHist(){const l=S.w.slice().sort((a,b)=>b.start-a.start);if(!l.length)return'<h1>History</h1><p class="mu">No workouts yet. Finish one on the Train tab and it will show up here.</p>';
return'<h1>History</h1>'+l.map(w=>`<div class="card"><div class="row tap" data-a="open" data-p="${w.id}"><div><b>${esc(w.name)}</b><div class="mu">${fd(w.start)}, ${Math.round((w.end-w.start)/6e4)} min, ${Math.round(dw(vol(w))).toLocaleString()} ${S.u} total</div></div><span class="mu">${ho[w.id]?'Hide':'Show'}</span></div>`+
(ho[w.id]?w.ex.map(e=>`<div style="margin-top:12px"><b>${esc(e.n)}</b><div class="mu">${e.sets.map(s=>dw(s.w)+' × '+s.r+(s.pr?' (PR)':'')).join(',  ')}</div></div>`).join('')+`<div class="row" style="margin-top:12px"><button class="x danger" data-a="hdel" data-p="${w.id}">Delete</button><button class="ghost" data-a="saver" data-p="${w.id}">Save as routine</button><button class="btn" data-a="rep" data-p="${w.id}">Repeat</button></div>`:'')+'</div>').join('')}
function vProg(){const names=[...new Set(S.w.flatMap(w=>w.ex.map(e=>e.n)))].sort();if(!names.includes(sel))sel=names[0];let h='<h1>Progress</h1>';
if(!names.length)h+='<p class="mu">Finish a workout to see lift trends and personal records.</p>';else{
const p=S.w.filter(w=>w.ex.some(e=>e.n===sel)).sort((a,b)=>a.start-b.start).map(w=>{const ss=w.ex.find(e=>e.n===sel).sets;return{x:w.start,y:dw(Math.max(...ss.map(s=>met==='e'?e1(s.w,s.r):s.w)))}});
h+=`<div class="card"><select data-f="sel" aria-label="Exercise">${names.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="seg" style="margin-top:10px"><button class="${met=='e'?'on':''}" data-a="met" data-p="e">Estimated 1RM</button><button class="${met=='w'?'on':''}" data-a="met" data-p="w">Top weight</button></div>${chart(p)}<div class="mu">Values in ${S.u}</div></div><h2>Personal records</h2><div class="card">`+
names.map(n=>{let b=null,m=0;sets(n).forEach(s=>{const v=e1(s.w,s.r)||s.r/1e3;if(v>m){m=v;b=s}});return b?`<div class="row" style="padding:6px 0"><span>${esc(n)}</span><span class="mu">${dw(b.w)} ${S.u} × ${b.r}${b.w?', 1RM ~'+Math.round(dw(e1(b.w,b.r))):''}</span></div>`:''}).join('')+'</div>'}
const bw=S.bw.slice().sort((a,b)=>a.t-b.t);
return h+`<h2>Body weight</h2><div class="card"><div class="row"><input id="bwi" inputmode="decimal" placeholder="${S.u}" aria-label="Body weight"><button class="btn" data-a="addbw">Add</button></div>${chart(bw.map(b=>({x:b.t,y:dw(b.kg)})))}`+bw.slice(-5).reverse().map(b=>`<div class="row"><span class="mu">${fd(b.t)}</span><span>${dw(b.kg)} ${S.u}</span><button class="x" data-a="bdel" data-p="${b.id}">Delete</button></div>`).join('')+'</div>'}
function vRout(){return'<h1>Routines</h1>'+(S.r.length?S.r.map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="mu">${r.ex.map(e=>esc(e.n)+' ('+e.sets.length+')').join(', ')}</div><div class="row" style="margin-top:12px"><button class="x danger" data-a="rdel" data-p="${r.id}">Delete</button><button class="btn" data-a="startr" data-p="${r.id}">Start</button></div></div>`).join(''):'<p class="mu">No routines yet. Save one from an active workout or from History.</p>')}
function vSet(){const sg=(k,l,f)=>`<div class="seg" style="margin-top:10px">${l.map(v=>`<button class="${f(v)?'on':''}" data-a="${k}" data-p="${v}">${k=='rest'?fm(v):v}</button>`).join('')}</div>`;
return`<h1>Settings</h1><div class="card"><b>Weight unit</b>${sg('unit',['kg','lb'],v=>S.u===v)}</div><div class="card"><b>Rest timer</b>${sg('rest',[60,90,120,180],v=>S.rest===v)}</div><div class="card set"><b>Your data</b><span class="mu">Stored on this device only. Export a backup regularly.</span><button class="ghost" data-a="exj">Export everything (JSON)</button><button class="ghost" data-a="exc">Export workouts (CSV)</button><button class="ghost" data-a="exb">Export body weight (CSV)</button><button class="ghost" data-a="imp">Import JSON backup</button><button class="ghost danger" data-a="wipe">Delete all data</button></div><div class="card mu">Install: on Android Chrome, open the menu and choose Install app. On iPhone Safari, tap Share, then Add to Home Screen.</div>`}
function render(){const y=scrollY;$('#app').innerHTML=({train:vTrain,hist:vHist,prog:vProg,rout:vRout,set:vSet})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===tab));scrollTo(0,y)}
function updateRT(){$('#rt').classList.toggle('on',!!rt)}
function begin(ex,name){const h=new Date().getHours();S.cur={id:uid(),name:name||(h<12?'Morning':h<17?'Afternoon':'Evening')+' workout',start:Date.now(),ex:ex.map(e=>({n:e.n,sets:e.sets.map(s=>({w:s.w,r:s.r,d:0}))}))};tab='train';wake()}
function openSheet(){$('#sheet').innerHTML='<div class="sh"><div class="row"><b>Add exercise</b><button class="x" data-a="closesheet">Close</button></div><input id="sq" placeholder="Search or type a new exercise" autocomplete="off" style="margin:8px 0"><div id="sl"></div></div>';$('#sheet').classList.add('open');sheetList('');$('#sq').focus()}
function sheetList(v){const t=v.trim(),l=t.toLowerCase(),all=allEx();$('#sl').innerHTML=(t&&!all.some(n=>n.toLowerCase()===l)?`<button class="li new" data-a="pick" data-p="${esc(t)}">Add “${esc(t)}”</button>`:'')+all.filter(n=>n.toLowerCase().includes(l)).slice(0,40).map(n=>`<button class="li" data-a="pick" data-p="${esc(n)}">${esc(n)}</button>`).join('')}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='sq')return sheetList(t.value);const f=t.dataset.f;if(!f||!S.cur)return;
if(f==='name')S.cur.name=t.value;else{const[i,j,k]=f.split('.'),s=S.cur.ex[i].sets[j],v=parseFloat(t.value.replace(',','.'))||0;s[k]=k==='w'?pw(v):v}save()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f==='sel'){sel=t.value;render()}
if(t.id==='imp'&&t.files[0])t.files[0].text().then(x=>{try{const d=JSON.parse(x);if(!Array.isArray(d.w))throw 0;if(confirm('Replace all current data with this backup?')){S=Object.assign(D(),d);save();render();toast('Data imported')}}catch(_){toast('That file is not a Lift Log backup')}t.value=''})});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,p=b.dataset.p;audio();let r=1,top=0;
switch(a){
case'tab':tab=p;top=1;break;
case'start':begin([]);top=1;break;
case'startr':{const x=S.r.find(x=>x.id===p);begin(x.ex,x.name);top=1;break}
case'rep':{const x=S.w.find(x=>x.id===p);begin(x.ex,x.name);top=1;break}
case'addex':openSheet();r=0;break;
case'pick':{if(!allEx().includes(p))S.ex.push(p);const ls=lastSets(p).filter(s=>s.d);S.cur.ex.push({n:p,sets:(ls.length?ls:[{w:0,r:0}]).map(s=>({w:s.w,r:s.r,d:0}))});$('#sheet').classList.remove('open');break}
case'closesheet':$('#sheet').classList.remove('open');r=0;break;
case'addset':{const s=S.cur.ex[p].sets,l=s[s.length-1]||{w:0,r:0};s.push({w:l.w,r:l.r,d:0});break}
case'rmset':S.cur.ex[p].sets.pop();break;
case'rmex':S.cur.ex.splice(p,1);break;
case'done':{const[i,j]=p.split('.').map(Number),x=S.cur.ex[i],s=x.sets[j];
if(s.d){s.d=0;s.pr=0}else{if(!s.r){toast('Enter reps first');return}
const pv=Math.max(bestE(x.n),...x.sets.filter((y,k)=>k!==j&&y.d).map(y=>e1(y.w,y.r)));s.d=1;s.pr=pv>0&&e1(s.w,s.r)>pv+1e-6;rt={end:Date.now()+S.rest*1e3,total:S.rest*1e3}}break}
case'finish':{const c=S.cur,ex=c.ex.map(e=>({n:e.n,sets:e.sets.filter(s=>s.d)})).filter(e=>e.sets.length);
if(!ex.length){if(!confirm('No sets are marked done. Discard this workout?'))return}else{S.w.push({...c,ex,end:Date.now()});toast('Workout saved')}S.cur=null;rt=null;top=1;break}
case'cancel':if(!confirm('Discard this workout?'))return;S.cur=null;rt=null;break;
case'saver':{const src=p==='cur'?S.cur:S.w.find(x=>x.id===p),n=prompt('Routine name',src.name);if(!n)return;S.r.push({id:uid(),name:n,ex:src.ex.filter(e=>e.sets.length).map(e=>({n:e.n,sets:e.sets.map(s=>({w:s.w,r:s.r}))}))});toast('Routine saved');break}
case'open':ho[p]=!ho[p];break;
case'hdel':if(!confirm('Delete this workout?'))return;S.w=S.w.filter(x=>x.id!==p);break;
case'rdel':if(!confirm('Delete this routine?'))return;S.r=S.r.filter(x=>x.id!==p);break;
case'unit':S.u=p;break;case'rest':S.rest=+p;break;case'met':met=p;break;
case'addbw':{const v=parseFloat($('#bwi').value.replace(',','.'));if(!(v>0)){toast('Enter your body weight');return}S.bw.push({id:uid(),t:Date.now(),kg:pw(v)});break}
case'bdel':S.bw=S.bw.filter(x=>x.id!==p);break;
case'rtadd':if(rt){rt.end+=p*1e3;rt.total=Math.max(rt.total,rt.end-Date.now())}break;
case'rts':rt=null;break;
case'exj':dl(`lift-log-${day()}.json`,JSON.stringify({...S,cur:null}),'application/json');r=0;break;
case'exc':dl(`lift-log-workouts-${day()}.csv`,csvSets(),'text/csv');r=0;break;
case'exb':dl(`lift-log-bodyweight-${day()}.csv`,'date,weight_kg,weight_lb\n'+S.bw.map(x=>`${new Date(x.t).toISOString().slice(0,10)},${+x.kg.toFixed(2)},${+(x.kg*K).toFixed(2)}`).join('\n'),'text/csv');r=0;break;
case'imp':$('#imp').click();r=0;break;
case'wipe':if(!confirm('Delete all workouts, routines and body weight data from this device?'))return;S=D();rt=null;break}
save();if(r){render();if(top)scrollTo(0,0)}updateRT()});
setInterval(()=>{const el=$('#el');if(el&&S.cur)el.textContent=fm((Date.now()-S.cur.start)/1e3);
if(rt){const l=rt.end-Date.now();if(l<=0){rt=null;ding();updateRT()}else{$('#rtt').textContent=fm(Math.ceil(l/1e3));$('#rtb').style.width=Math.min(100,l/rt.total*100)+'%'}}},250);
render();updateRT();if(S.cur)wake();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
